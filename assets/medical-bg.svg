    <path d="M 50 300 C 10 340, 90 380, 50 420 C 10 460, 90 500, 50 540"/>
    <line x1="90" y1="310" x2="50" y2="310"/>
    <line x1="80" y1="350" x2="60" y2="350"/>
    <line x1="90" y1="390" x2="50" y2="390"/>
    <line x1="60" y1="430" x2="80" y2="430"/>
    <line x1="90" y1="470" x2="50" y2="470"/>
    <line x1="80" y1="510" x2="60" y2="510"/>
