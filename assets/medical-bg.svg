  <g opacity="0.18" fill="none" stroke="#00ffa3" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 0 400 L 230 400 L 260 340 L 300 460 L 335 380 L 360 400 L 1200 400"/>
  </g>

  <!-- Medical cross motifs, scattered, very subtle -->
  <g opacity="0.16" fill="#8b5cf6">
    <g transform="translate(1000,480)">
      <rect x="-6" y="-18" width="12" height="36" rx="3"/>
      <rect x="-18" y="-6" width="36" height="12" rx="3"/>
    </g>
    <g transform="translate(180,180) scale(0.7)">
