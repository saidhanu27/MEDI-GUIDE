      <circle cx="60" cy="220" r="2"/><circle cx="140" cy="220" r="2"/><circle cx="220" cy="220" r="2"/>
      <circle cx="900" cy="90" r="2"/><circle cx="980" cy="90" r="2"/><circle cx="1060" cy="90" r="2"/>
      <circle cx="1140" cy="90" r="2"/><circle cx="900" cy="170" r="2"/><circle cx="980" cy="170" r="2"/>
